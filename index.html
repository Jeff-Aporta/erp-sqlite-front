<!doctype html>
<html lang="es" data-theme="dark" data-palette="contapyme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ERP SQLite</title>
<link rel="icon" href="data:,">
<meta name="description" content="ERP SQLite — app de web components sobre el kit iswc-root.">

<!-- Tema antes del primer pintado: ?s= (theme/palette) > localStorage del kit > dark. Script plano. -->
<script src="./dist/cdn/boot.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./dist/cdn/styles/app.css">
<style>
  :root { --iswc-font-sans: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif; --iswc-card-spacing: clamp(1.25rem, 2.4vw, 2rem); }
  html, body { font-family: var(--iswc-font-sans); }
</style>

<!-- 1) Loader del kit por CDN pineado (un solo SHA en toda la app; `deno task pin` lo mantiene). -->
<script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@7ee7b872b431db52835da07d9ea189d7d64c2562/dist/cdn/core/loader.min.js"></script>
<!-- 2) Registrador de la app: tag → URL ?v=<hash> (lo genera el build). Sin ?v= aquí: el loader lo pone. -->
<script type="module" src="./dist/cdn/erpLoader.min.js"></script>
<!-- 3) Arranque: estilos del kit, tags del kit y de la app, marca de lista con watchdog. -->
<script type="module">
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(() => { console.warn('[erp] el arranque excedió 6 s; se revela la página'); listo(); }, 6000);
  try {
    if (!L) throw new Error('falta iswcLoader');
    await L.loadPageStyles(['iswc-palettes-default']);
    const { KIT_TAGS, tagsArranque } = await import('./dist/cdn/js/kit-tags.js');
    await L.load(...KIT_TAGS, ...tagsArranque());
  } catch (e) {
    console.warn('[erp] arranque', e);
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
</head>
<body>
  <noscript>JavaScript requerido.</noscript>
  <iswc-toast placement="bottom-end"></iswc-toast>
  <erp-app></erp-app>
</body>
</html>
