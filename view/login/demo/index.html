<!doctype html>
<html lang="es" data-theme="dark" data-palette="contapyme">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP SQLite · login · demo</title>
<meta name="robots" content="noindex">
<script src="../../../dist/cdn/boot.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/gh/Jeff-Aporta/is-webcomponents@7ee7b872b431db52835da07d9ea189d7d64c2562/dist/cdn/core/loader.min.js"></script>
<script type="module" src="../../../dist/cdn/erpLoader.min.js"></script>
<style>
  body { display: grid; gap: 1.5rem; padding: 1.5rem; background: var(--iswc-bg); color: var(--iswc-text); font-family: var(--iswc-font-sans); }
  h2 { margin: 0; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.07em; opacity: 0.6; }
</style>
<script type="module">
  // Mismo arranque que la app: marca `data-app-ready` al terminar (watchdog de 6 s).
  const L = globalThis.iswcLoader;
  const listo = () => document.documentElement.setAttribute('data-app-ready', '');
  const watchdog = setTimeout(listo, 6000);
  try {
    await L.loadPageStyles(['iswc-palettes-default']);
    const { KIT_TAGS, VIEW_TAGS } = await import('../../../dist/cdn/js/kit-tags.js');
    await L.load(...KIT_TAGS, ...VIEW_TAGS.login);
    // Datos de muestra: cada sub-pieza de la vista, aislada (aquí, el login con y sin aviso).
    document.querySelector('#con-aviso').props = { aviso: 'Tu sesión expiró: vuelve a entrar' };
  } finally {
    clearTimeout(watchdog);
    listo();
  }
</script>
</head>
<body>
  <section><h2>Login</h2><erp-login></erp-login></section>
  <section><h2>Con aviso</h2><erp-login id="con-aviso"></erp-login></section>
</body>
</html>
